# Use case Configuration for sof-soundwire card
#
# This file is included by the stock HiFi verb as
# /sof-soundwire/${SpeakerCodecFile}.conf once the card components contain
# spk:tas2783. Stock sof-soundwire.conf does not include
# /codecs/tas2783/init.conf, so this file must not reference variables that
# only that init file defines (SpeakerMixerElem). Doing so makes
# snd_use_case_mgr_open() fail with -EINVAL and PipeWire falls back to a
# dummy sink.
#
# The switches below are the ones the in-tree TAS2783 driver exposes.

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Left Spk Switch' on"
		cset "name='Right Spk Switch' on"
		cset "name='Left Spk2 Switch' on"
		cset "name='Right Spk2 Switch' on"
	]

	DisableSequence [
		cset "name='Left Spk Switch' off"
		cset "name='Right Spk Switch' off"
		cset "name='Left Spk2 Switch' off"
		cset "name='Right Spk2 Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
