# Fedora: do not set LLVM=1. The distro kernel is GCC-built; Clang rejects
# GCC Kbuild flags such as -mpreferred-stack-boundary=3.
# Install into /extra so this module shadows the stock in-tree codec.
PACKAGE_NAME="snd-soc-tas2783-sdw-px13"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="snd-soc-tas2783-sdw"
DEST_MODULE_LOCATION[0]="/extra"
MAKE[0]="make KVER=${kernelver}"
CLEAN="make KVER=${kernelver} clean"
AUTOINSTALL="yes"
